name: Chess4D Filament Fetch

on:
  push:
    branches: [ main, chess4d-filament-fetch ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify official binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out

          curl -L --fail --retry 3 -o out/filament-v1.77.0-android.aar \
            https://github.com/google/filament/releases/download/v1.77.0/filament-v1.77.0-android.aar
          curl -L --fail --retry 3 -o out/gltfio-v1.77.0-android.aar \
            https://github.com/google/filament/releases/download/v1.77.0/gltfio-v1.77.0-android.aar
          curl -L --fail --retry 3 -o out/filament-utils-v1.77.0-android.aar \
            https://github.com/google/filament/releases/download/v1.77.0/filament-utils-v1.77.0-android.aar
          curl -L --fail --retry 3 -o gltfpack-ubuntu.zip \
            https://github.com/zeux/meshoptimizer/releases/download/v1.2/gltfpack-ubuntu.zip

          echo "8178054a27fc688b0e9fdcdccb8e92dc84f7fb01b722288387d1acad60864bba  out/filament-v1.77.0-android.aar" | sha256sum -c -
          echo "8ef87b59fa7f333d90e5344237c0648ac652fdfcbd7a9e7318a65ce2860be23a  out/gltfio-v1.77.0-android.aar" | sha256sum -c -
          echo "e070e7830ec026209f9bbb2d2da258f99215796438746f3e4ac5a869f7607522  out/filament-utils-v1.77.0-android.aar" | sha256sum -c -
          echo "ebc236f5f6c08c7e5c5750476a187d24805d44d8c680449c4b7369c333f817b1  gltfpack-ubuntu.zip" | sha256sum -c -

          unzip -j gltfpack-ubuntu.zip -d gltfpack-extracted
          GLTFPACK="$(find gltfpack-extracted -maxdepth 1 -type f -name 'gltfpack*' | head -n1)"
          test -n "$GLTFPACK"
          cp "$GLTFPACK" out/gltfpack
          chmod +x out/gltfpack
          out/gltfpack -h >/dev/null 2>&1 || true

          curl -L --fail --retry 3 -o out/ABeautifulGame.glb \
            https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/90d7ede14c7e280af263824604b427a1ca02cb66/Models/ABeautifulGame/glTF-Binary/ABeautifulGame.glb

          test "$(xxd -l 4 -p out/ABeautifulGame.glb)" = "676c5446"
          test "$(stat -c%s out/ABeautifulGame.glb)" -gt 1000000

          cat > out/PROVENANCE.txt <<'EOF'
          Filament Android AARs: google/filament v1.77.0
          meshoptimizer/gltfpack: zeux/meshoptimizer v1.2
          Chess model: KhronosGroup/glTF-Sample-Assets
          Model commit: 90d7ede14c7e280af263824604b427a1ca02cb66
          Model path: Models/ABeautifulGame/glTF-Binary/ABeautifulGame.glb
          EOF

          (cd out && sha256sum * > SHA256SUMS.txt)
          ls -lh out

      - name: Upload Chess4D dependency bundle
        uses: actions/upload-artifact@v4
        with:
          name: chess4d-filament-binaries
          path: out/
          retention-days: 1
          if-no-files-found: error
